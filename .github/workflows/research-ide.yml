name: Research IDE library
on:
  push:
    paths: ['Research_IDE/**', '.github/workflows/research-ide.yml']
  pull_request:
    paths: ['Research_IDE/**', '.github/workflows/research-ide.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: make -C Research_IDE check
