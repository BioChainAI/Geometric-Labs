name: Cryptographic research
on:
  push:
    paths: ['Cryptographic_Research/**', 'src/geometric_labs/**', '.github/workflows/cryptographic-research.yml']
  pull_request:
    paths: ['Cryptographic_Research/**', 'src/geometric_labs/**', '.github/workflows/cryptographic-research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: make -C Cryptographic_Research check
      - name: Item tests run as standalone scripts
        shell: bash
        run: |
          for test in Cryptographic_Research/*/CR-*/tests/test_*.py; do
            env -u PYTHONPATH python "$test"
          done
