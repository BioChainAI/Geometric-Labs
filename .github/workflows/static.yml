name: Build and deploy Geometric Labs Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and update history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up scanner
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scanner and page contracts
        run: python -m unittest discover -s tools/pages/tests -v
      - name: Build and validate curated site artifact
        run: python tools/pages/build.py --require-clean --output "$RUNNER_TEMP/geometric-pages"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/geometric-pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
