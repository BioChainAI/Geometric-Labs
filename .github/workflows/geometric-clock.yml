name: Geometric clock exact reference
on:
  push:
    paths: ['ecosystem/experiments/geometric_clock/**', 'spec_sync/golden_vectors/v1_tiles_forms_0_15.json', '.github/workflows/geometric-clock.yml']
  pull_request:
    paths: ['ecosystem/experiments/geometric_clock/**', 'spec_sync/golden_vectors/v1_tiles_forms_0_15.json', '.github/workflows/geometric-clock.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install standalone package and test tools
        run: python -m pip install './ecosystem/experiments/geometric_clock[test]'
      - name: Exact arithmetic, byte conformance and negative handshake tests
        run: python -m pytest ecosystem/experiments/geometric_clock/tests -q
      - name: Run installed logical ticker outside the checkout
        working-directory: /tmp
        run: |
          python -I -m geometric_clock --pulses 30
          python -I -m geometric_clock --verify-sync
