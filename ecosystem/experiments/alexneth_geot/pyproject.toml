[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "biochain-alexneth-geot-experimental"
version = "0.2.0"
requires-python = ">=3.10"
description = "Experimental multiscale fold3 and Lorentz sparse-routing CPU reference"
dependencies = ["torch==2.9.1+cpu"]

[tool.setuptools.packages.find]
where = ["src"]
