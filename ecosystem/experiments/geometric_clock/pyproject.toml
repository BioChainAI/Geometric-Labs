[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geometric-clock"
version = "0.1.0"
description = "Exact logical Geometric Engine clock and simulated parity handshake"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
geometric-clock = "geometric_clock.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["geometric_clock*"]

[tool.setuptools.package-data]
geometric_clock = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
